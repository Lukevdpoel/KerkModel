<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Kerkmodel</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2b2f33;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #f2f2f2;
      }
      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
        background: #2b2f33;
      }
      #cover {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        padding: 0 6vw;
        background: #2b2f33;
        text-align: center;
      }
      #cover h1 {
        margin: 0;
        font-size: max(28px, 5vh);
        font-weight: 600;
      }
      #cover p {
        margin: 0;
        font-size: max(18px, 2.8vh);
        line-height: 1.4;
        max-width: 40em;
      }
      #bar {
        width: min(80vw, 60vh);
        height: max(14px, 2vh);
        border-radius: 1vh;
        background: #444a50;
        overflow: hidden;
      }
      #fill {
        width: 0%;
        height: 100%;
        background: #e8b04a;
        transition: width 0.2s;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="cover">
      <h1 id="title">Het kerkmodel wordt geladen</h1>
      <div id="bar"><div id="fill"></div></div>
      <p id="message">Een ogenblik geduld. De eerste keer kan dit een minuut duren.</p>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var cover = document.querySelector("#cover");
      var title = document.querySelector("#title");
      var message = document.querySelector("#message");
      var bar = document.querySelector("#bar");
      var fill = document.querySelector("#fill");

      // Right-drag pans the view, so the browser's own right-click menu must stay away.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      function fail(heading, text) {
        bar.classList.add("hidden");
        title.textContent = heading;
        message.textContent = text;
        cover.classList.remove("hidden");
      }

      function hasWebGL2() {
        try {
          return !!document.createElement("canvas").getContext("webgl2");
        } catch (e) {
          return false;
        }
      }

      if (!hasWebGL2()) {
        fail("Het kerkmodel kan hier niet worden getoond",
             "Deze computer of browser kan geen 3D-beelden tonen. Probeer het in Google Chrome of Microsoft Edge, of op een andere computer.");
      } else {
        var script = document.createElement("script");
        script.src = "Build/WebBuild.loader.js";
        script.onload = function () {
          createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/WebBuild.data.unityweb",
            frameworkUrl: "Build/WebBuild.framework.js.unityweb",
            codeUrl: "Build/WebBuild.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "ModelViewer",
            productVersion: "0.1.0",
            showBanner: function (text, type) {
              if (type === "error") console.error(text); else console.warn(text);
            }
          }, function (progress) {
            fill.style.width = Math.round(progress * 100) + "%";
          }).then(function () {
            cover.classList.add("hidden");
            canvas.focus();
          }).catch(function (error) {
            console.error(error);
            fail("Het kerkmodel kon niet worden geopend",
                 "Er ging iets mis tijdens het laden. Ververs de pagina om het opnieuw te proberen, of probeer het in Google Chrome of Microsoft Edge.");
          });
        };
        script.onerror = function () {
          fail("Het kerkmodel kon niet worden geopend",
               "De bestanden konden niet worden gedownload. Controleer de internetverbinding en ververs de pagina.");
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
